<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17131f">
<title>Aisha Beauty Home</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 18px;
    font-family:Arial,Helvetica,sans-serif;color:#fff;
    background:radial-gradient(circle at top,#56334f 0,#241b2c 42%,#121018 100%)}
  .page{width:min(100%,430px);text-align:center}
  .logo{width:92px;height:92px;margin:0 auto 18px;border-radius:50%;
    display:grid;place-items:center;background:linear-gradient(145deg,#f5d5e8,#bd7ca6);
    color:#382136;font-size:27px;font-weight:800;letter-spacing:1px;
    border:3px solid rgba(255,255,255,.75);box-shadow:0 8px 30px #0005}
  h1{font-size:27px;letter-spacing:1.5px;margin:0 0 8px}
  .sub{color:#e7d9e5;margin:0 0 30px;font-size:15px}
  .links{display:grid;gap:14px}
  a{min-height:62px;border-radius:17px;display:flex;align-items:center;justify-content:center;
    gap:12px;text-decoration:none;color:#fff;font-size:17px;font-weight:700;
    box-shadow:0 8px 22px #0003;transition:transform .15s,filter .15s}
  a:active{transform:scale(.98)}
  .tt{background:#171717;border:1px solid #ffffff40}
  .ig{background:linear-gradient(110deg,#833ab4,#e1306c,#f77737)}
  .wa{background:#168b55}
  .icon{font-size:23px}
  footer{margin-top:28px;color:#c9b9c8;font-size:12px;letter-spacing:1px}
</style>
</head>
<body>
<main class="page">
  <div class="logo" aria-label="Aisha Beauty Home">ABH</div>
  <h1>AISHA BEAUTY HOME</h1>
  <p class="sub">Bizi sosial şəbəkələrdə izləyin</p>
  <nav class="links" aria-label="Sosial şəbəkə keçidləri">
    <a class="tt" href="https://www.tiktok.com/@aisha_beauty_home" target="_blank" rel="noopener noreferrer"><span class="icon">♪</span> TIKTOK</a>
    <a class="ig" href="https://www.instagram.com/aisha_beauty_home/" target="_blank" rel="noopener noreferrer"><span class="icon">◎</span> INSTAGRAM</a>
    <a class="wa" href="https://whatsapp.com/channel/0029VbEFYHsLo4hefzOdo71d" target="_blank" rel="noopener noreferrer"><span class="icon">◉</span> WHATSAPP KANALI</a>
  </nav>
  <footer>FOLLOW • CONNECT • BEAUTY</footer>
</main>
</body>
</html>
